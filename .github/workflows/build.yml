name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: build
        shell: msys2 {0}
        run: |
          g++ -shared -static -static-libgcc -static-libstdc++ -O2 -o ghost.dll ghost.cpp -luser32
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-dll
          path: ghost.dll
